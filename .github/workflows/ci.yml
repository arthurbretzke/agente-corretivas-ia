name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testes do app
        run: mvn -B test
        working-directory: app
      - name: Autotestes dos scripts
        run: |
          python3 scripts/guarda.py --teste
          python3 -I scripts/contrato/impacto.py --teste
